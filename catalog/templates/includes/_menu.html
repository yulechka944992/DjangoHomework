<nav class="ms-5">
    <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:home' %}">Главная</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:product_list' %}">Каталог</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'blog:blog_list' %}">Блог</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'catalog:contacts' %}">Контакты</a>
    {% if user.is_authenticated %}
        <a class="p-2 btn btn-success" href="{% url 'catalog:product_create' %}">+ Добавить товар</a>
        <span class="p-2 text-muted">Привет, {{ user.username }}!</span>
        <form action="{% url 'users:logout' %}" method="post" class="d-inline">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-danger">Выйти</button>
        </form>
    {% else %}
        <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
        <a class="p-2 btn btn-outline-success" href="{% url 'users:register' %}">Регистрация</a>
    {% endif %}
</nav>
