{% extends 'base.html' %}

{% block title %}Skystore — каталог{% endblock %}

{% block content %}
<div class="row text-center">
    {% for product in products %}
        {% include 'includes/_product_card.html' %}
    {% empty %}
        <p>Товаров пока нет</p>
    {% endfor %}
</div>

<div class="mt-4">
    <a href="{% url 'catalog:product_list' %}" class="btn btn-lg btn-primary">Смотреть все товары</a>
</div>
{% endblock %}
